  <div class="fixture-row">
    <div class="fixture-col">
      <div class="fixture-label">Viewer Mode</div>

    <div class="fixture-col">
      <div class="fixture-label">Editor Mode</div>
      <div id="editor-root" data-mode="editor"></div>
