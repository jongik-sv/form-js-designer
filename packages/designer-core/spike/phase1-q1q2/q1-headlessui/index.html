<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q1 Headless UI + preact/compat spike</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 24px;
        color: #222;
      }
      section {
        border: 1px solid #ddd;
        padding: 16px;
        margin-bottom: 20px;
        border-radius: 6px;
      }
      button {
        padding: 6px 12px;
        border: 1px solid #555;
        background: #fff;
        cursor: pointer;
      }
      .hl-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }
      .hl-dialog-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        padding: 24px;
        border-radius: 8px;
        min-width: 300px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      }
      [role='tablist'] {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid #ccc;
        margin-bottom: 8px;
      }
      [role='tab'] {
        padding: 6px 14px;
        border: 1px solid transparent;
        border-bottom: none;
        background: transparent;
        cursor: pointer;
      }
      [role='tab'][aria-selected='true'] {
        background: #f7f7ff;
        border-color: #99a;
      }
      .pop-panel {
        padding: 8px 12px;
        background: #fffbe6;
        border: 1px solid #e4cf6b;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Q1 Headless UI + preact/compat spike</h1>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
