<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q1 Custom ARIA Spike</title>
    <style>
      body { font-family: -apple-system, 'Noto Sans KR', sans-serif; padding: 24px; color: #222; }
      main { min-height: 60vh; }
      button { padding: 8px 16px; cursor: pointer; font-size: 14px; }
      input { padding: 8px 12px; font-size: 14px; width: 100%; box-sizing: border-box; }
      section { margin-bottom: 32px; }
      h1, h2 { color: #111; }

      /* Dialog styles */
      .caria-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.45);
        z-index: 40; display: flex; align-items: center; justify-content: center;
      }
      .caria-content {
        background: white; padding: 24px; border-radius: 8px; min-width: 320px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 50; color: #111;
      }
      .caria-title { margin: 0 0 8px; font-size: 18px; }
      .caria-desc { margin: 0 0 16px; color: #444; }
      .caria-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Q1 후보 E — 자작 WAI-ARIA (외부 UI 라이브러리 0)</h1>
      <div id="app"></div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
