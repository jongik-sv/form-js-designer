<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>form-js Notion Adapter — 샘플 페이지</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #fff;
      color: #1a1a1a;
    }
    body[data-theme="dark"] {
      background: #1a1a1a;
      color: #f0f0f0;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      align-items: center;
    }
    button {
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 14px;
    }
    #blocks-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .block-wrapper {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px;
      min-height: 40px;
    }
    .form-js-block {
      height: auto;
    }
    .form-js-error-banner {
      color: #c0392b;
      padding: 8px;
      border: 1px solid #e74c3c;
      border-radius: 4px;
      background: #fdf2f2;
    }
  </style>
</head>
<body data-theme="light">
  <h1>form-js Notion Adapter — PoC 샘플</h1>
  <div class="toolbar">
    <button id="btn-insert-block" data-testid="btn-insert-block">+ 블록 삽입</button>
    <button id="btn-toggle-theme" data-testid="btn-toggle-theme">
      <span id="theme-label">다크 모드</span>
    </button>
  </div>
  <div id="blocks-container" data-testid="blocks-container"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
