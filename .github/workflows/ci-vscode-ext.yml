name: ci-vscode-ext

on:
  push:
    branches: [main, develop]
    tags:
      - 'vscode-ext-v*'
    paths:
      - 'packages/designer-vscode-extension/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/designer-vscode-extension/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-ext-ci:
    name: ci · designer-vscode-extension (lint / typecheck / test:unit / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm -w designer-vscode-extension run lint
      - name: Typecheck
        run: npm -w designer-vscode-extension run typecheck
      - name: Unit tests
        run: npm -w designer-vscode-extension run test:unit
      - name: Build
        run: npm -w designer-vscode-extension run build

  perf-gate:
    name: perf · 렌더 p95 ≤ 500ms + .vsix ≤ 5MB (TSK-04-03)
    runs-on: ubuntu-latest
    needs: vscode-ext-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build (prod)
        run: npm -w @form-js-designer/designer-vscode-extension run build:prod
      - name: Package (.vsix)
        run: npm -w @form-js-designer/designer-vscode-extension run package
      - name: Run perf gate (render p95 + vsix size)
        run: npm -w @form-js-designer/designer-vscode-extension run test:perf
      - name: Upload perf-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-report
          path: packages/designer-vscode-extension/reports/perf-gate.json

  release-vsix:
    name: release · designer-vscode-extension (.vsix 생성 + 사내 저장소 업로드)
    if: startsWith(github.ref, 'refs/tags/vscode-ext-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (production)
        run: npm -w @form-js-designer/designer-vscode-extension run build:prod
      - name: Package (.vsix)
        id: package
        run: |
          # --silent: npm 자체 로그 억제. package.mjs 로그(stderr)는 유지하여 빌드 오류 진단 가능.
          VSIX_PATH=$(npm -w @form-js-designer/designer-vscode-extension run package --silent | tail -1)
          echo "vsix_path=${VSIX_PATH}" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$(basename "${VSIX_PATH}")" >> "$GITHUB_OUTPUT"
      - name: Upload to internal registry
        if: env.INTERNAL_REGISTRY_URL != ''
        env:
          INTERNAL_REGISTRY_URL: ${{ secrets.INTERNAL_REGISTRY_URL }}
          INTERNAL_REGISTRY_TOKEN: ${{ secrets.INTERNAL_REGISTRY_TOKEN }}
        run: |
          node packages/designer-vscode-extension/scripts/upload-vsix.mjs "${{ steps.package.outputs.vsix_path }}"
      - name: Upload .vsix as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.vsix_name }}
          path: ${{ steps.package.outputs.vsix_path }}
          retention-days: 90
